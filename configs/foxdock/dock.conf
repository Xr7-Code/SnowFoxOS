# SnowFoxOS v4 — foxdock configuration
# One line per entry: name;icon;exec
# icon: absolute path, or an icon name resolved via common theme dirs
# Empty file => auto-scan /usr/share/applications.

icon_size=32
padding=6

Terminal;utilities-terminal;kitty
Files;system-file-manager;pcmanfm
Editor;accessories-text-editor;geany
Browser;web-browser;firefox-esr
Network;network-wireless;~/.config/scripts/network.sh
Settings;preferences-system;~/.config/scripts/settings-menu.sh

