# SnowFox Minimal Dark

font_family      monospace
font_size 11.0

cursor_shape beam
cursor_blink_interval 0
cursor #9B59B6

window_padding_width 8
background_opacity 0.95
confirm_os_window_close 0
hide_window_decorations yes

# Dark Colors
foreground #e0e0e0
background #000000
selection_foreground #000000
selection_background #9B59B6

# Black
color0 #000000
color8 #666666

# Red
color1 #ff5555
color9 #ff7777

# Green
color2 #50fa7b
color10 #69ff94

# Yellow/Orange
color3 #E67E22
color11 #ffaa00

# Blue
color4 #6e6eff
color12 #8888ff

# Purple
color5 #9B59B6
color13 #c084fc

# Cyan
color6 #60a5fa
color14 #80b5ff

# White
color7 #e0e0e0
color15 #ffffff
