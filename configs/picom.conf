# ============================================================
#  SnowFoxOS v4 — picom config
#  No transparency (plan §2.2 rule 4). Fading disabled.
# ============================================================

backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 20;
shadow-offset-x = -10;
shadow-offset-y = 6;
shadow-opacity = 0.25;
shadow-color = "#101114";

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "class_g = 'Dunst'",
    "class_g = 'Rofi'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'"
];

corner-radius = 12;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

fading = false;
mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
detect-transient       = true;
log-level              = "warn";

# BEGIN SNOWFOX PALETTE
# END SNOWFOX PALETTE

