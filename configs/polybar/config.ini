; ============================================================
;    SnowFoxOS v3.4 — Polybar Config
;    Design: Neutral grey/black · Purple accent only
;    Generated by: configs/snowfox/palette.conf (snowfox theme)
; ============================================================

[colors]
; ── Base (neutral grey/black) ────────────────────────────────
bg          = #111111
bg-alt      = #1a1a1a
border      = #2a2a2a
fg          = #e8e8e8
fg-dim      = #888888
on-accent   = #ffffff

; ── Accent (purple — highlights only) ───────────────────────
accent      = #9966cc
accent-lt   = #b399e0
accent-dim  = #5c3d80

; ── Status ──────────────────────────────────────────────────
green       = #88aa77
yellow      = #ddbb66
red         = #cc6666
cyan        = #77aacc
orange      = #cc8855

; ── Transparency ────────────────────────────────────────────
transparent = #00000000

; ============================================================
;    Base Bar
; ============================================================
[bar/base]
width               = 100%
offset-x            = 0
offset-y            = 0
height              = 36
radius              = 0

pseudo-transparency = true
fixed-center        = true

background = ${colors.bg}
foreground = ${colors.fg}

border-size   = 0
line-size     = 0

padding-left  = 1
padding-right = 1

module-margin-left  = 0
module-margin-right = 2

font-0 = "JetBrainsMono Nerd Font:style=Medium:size=9;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-2 = "JetBrainsMono Nerd Font:size=12;3"
font-3 = "JetBrainsMono Nerd Font:size=8;2"
font-4 = "Noto Color Emoji:scale=10;3"

wm-restack = i3
override-redirect = false

tray-position   = right
tray-maxsize    = 14
tray-padding    = 5
tray-background = ${colors.bg}
tray-offset-y   = 0

; Thin purple bottom line — accent used minimally
border-bottom-size  = 1
border-bottom-color = ${colors.accent}


; ============================================================
;    Desktop Bar
; ============================================================
[bar/snowfox]
inherit = bar/base
modules-left   = launcher workspaces
modules-center = date
modules-right  = memory network pulseaudio bluetooth tray-spacer


; ============================================================
;    Laptop Bar
; ============================================================
[bar/snowfox-laptop]
inherit = bar/base
modules-left   = launcher workspaces
modules-center = date
modules-right  = backlight battery memory network pulseaudio bluetooth tray-spacer


; ============================================================
;    Helper
; ============================================================
[module/tray-spacer]
type = custom/text
content = "  "
content-foreground = ${colors.transparent}

; ============================================================
;    Launcher
; ============================================================
[module/launcher]
type = custom/text
content = %{A1:rofi -show drun -theme ~/.config/rofi/config.rasi:}%{O2}🦊︎%{O-1}%{A}
content-font       = 1
content-foreground = ${colors.accent}
content-background = ${colors.bg}
content-padding    = 1

; ============================================================
;    Workspaces
; ============================================================
[module/workspaces]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode            = %mode%
label-mode-padding    = 2
label-mode-foreground = ${colors.orange}
label-mode-background = ${colors.bg}

; Active: invert — purple bg, white text
label-focused            = %name%
label-focused-foreground = ${colors.on-accent}
label-focused-background = ${colors.accent}
label-focused-padding    = 2

; Inactive: grey text on dark bg
label-unfocused            = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-background = ${colors.bg}
label-unfocused-padding    = 2

; Urgent: red
label-urgent            = %name%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg}
label-urgent-padding    = 2

; Visible (window on other workspace): light purple hint
label-visible            = %name%
label-visible-foreground = ${colors.accent-lt}
label-visible-background = ${colors.bg}
label-visible-padding    = 2


; ============================================================
;    Clock
; ============================================================
[module/date]
type     = internal/date
interval = 1

date     =  %H:%M
date-alt =  %H:%M   %a, %d.%m.%Y

format            = <label>
format-background = ${colors.bg}
format-padding    = 2

label            = %date%
label-font       = 2
label-foreground = ${colors.fg}


; ============================================================
;    RAM
; ============================================================
[module/memory]
type     = internal/memory
interval = 4

format              = <label>
format-prefix       = "󰍛 "
format-prefix-font  = 3
format-prefix-foreground = ${colors.fg-dim}
format-background   = ${colors.bg}
format-padding      = 1

label            = %percentage_used%%
label-foreground = ${colors.fg}


; ============================================================
;    Network
; ============================================================
[module/network]
type = custom/script
interval = 5
exec = ~/.config/polybar/scripts/network-status.sh

format            = <label>
format-background = ${colors.bg}
format-padding    = 1
label             = %output%
label-foreground  = ${colors.fg}


; ============================================================
;    Volume
; ============================================================
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume              = <label-volume>
format-volume-prefix       = "󰕾 "
format-volume-prefix-font  = 3
format-volume-prefix-foreground = ${colors.fg-dim}
format-volume-background   = ${colors.bg}
format-volume-padding      = 1
label-volume               = %percentage%%
label-volume-foreground    = ${colors.fg}

format-muted               = <label-muted>
format-muted-prefix        = "󰖁 "
format-muted-prefix-font   = 3
format-muted-prefix-foreground = ${colors.accent-dim}
format-muted-background    = ${colors.bg}
format-muted-padding       = 1
label-muted                = muted
label-muted-foreground     = ${colors.fg-dim}

click-right = pavucontrol &


; ============================================================
;    Battery
; ============================================================
[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = ACAD
poll-interval = 10
full-at       = 99
low-at        = 15

format-charging              = <label-charging>
format-charging-prefix       = "󰂄 "
format-charging-prefix-font  = 3
format-charging-prefix-foreground = ${colors.green}
format-charging-background   = ${colors.bg}
format-charging-padding      = 1
label-charging               = %percentage%%
label-charging-foreground    = ${colors.fg}

format-discharging              = <label-discharging>
format-discharging-prefix       = "󰁹 "
format-discharging-prefix-font  = 3
format-discharging-prefix-foreground = ${colors.fg-dim}
format-discharging-background   = ${colors.bg}
format-discharging-padding      = 1
label-discharging               = %percentage%%
label-discharging-foreground    = ${colors.fg}

format-full              = <label-full>
format-full-prefix       = "󰁹 "
format-full-prefix-font  = 3
format-full-prefix-foreground = ${colors.green}
format-full-background   = ${colors.bg}
format-full-padding      = 1
label-full               = full
label-full-foreground    = ${colors.fg-dim}

format-low              = <label-low>
format-low-prefix       = "󰂃 "
format-low-prefix-font  = 3
format-low-prefix-foreground = ${colors.red}
format-low-background   = ${colors.bg}
format-low-padding      = 1
label-low               = %percentage%%!
label-low-foreground    = ${colors.red}


; ============================================================
;    Brightness (Laptop)
; ============================================================
[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format              = <label>
format-prefix       = "󰃠 "
format-prefix-font  = 3
format-prefix-foreground = ${colors.fg-dim}
format-background   = ${colors.bg}
format-padding      = 1
label               = %percentage%%
label-foreground    = ${colors.fg}


; ============================================================
;    Bluetooth
; ============================================================
[module/bluetooth]
type = custom/script
interval = 3
exec = ~/.config/polybar/scripts/bluetooth.sh
click-left = ~/.config/polybar/scripts/bluetooth.sh toggle

format            = <label>
format-background = ${colors.bg}
format-padding    = 1
label             = %output%
label-foreground  = ${colors.fg}
