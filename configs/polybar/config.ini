; SnowFoxOS v4 — Polybar (minimalist 2-color reference)
; Colors live in the generated [colors] block (theme_engine).
; Rule: active workspace INVERTS bg and accent. No alpha anywhere.

[bar/snowfox]
monitor = ${env:MONITOR:}
width = 100%
height = 36
offset-x = 0
offset-y = 0
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
modules-left = i3
modules-center = date
modules-right = pulseaudio gap network gap tray-spacer
border-bottom-size = 1
border-bottom-color = ${colors.primary}
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
separator =
tray-position = right
tray-padding = 1
cursor-click = pointer
cursor-scroll = ns-resize

[bar/snowfox-laptop]
inherit = bar/snowfox
modules-center = date
modules-right = backlight gap battery gap memory gap network gap pulseaudio gap bluetooth gap tray-spacer

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 1
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 1
label-visible = %index%
label-visible-background = ${colors.background}
label-visible-foreground = ${colors.foreground-alt}
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = "%d.%m.%Y"
time = "%H:%M"
label = 󰥔 %time%
label-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted = <label-muted>
label-muted = 󰝟 muted
label-muted-foreground = ${colors.alert}
label-volume-padding = 1
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

[module/network]
type = internal/network
interface = auto
interval = 3
format-connected = <label-connected>
label-connected = 󰖩 %essid%
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected = 󰖪 offline
label-disconnected-foreground = ${colors.alert}
label-connected-padding = 1
label-disconnected-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-charging-foreground = ${colors.foreground}
label-discharging-foreground = ${colors.foreground}
label-full-foreground = ${colors.foreground}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰂃
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅

[module/backlight]
type = internal/backlight
card = intel_backlight
format = <ramp> <label>
label = %percentage%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 10
format-foreground = ${colors.foreground}
format-padding = 1

[module/tray-spacer]
type = custom/script
exec = echo " "
interval = 3600

