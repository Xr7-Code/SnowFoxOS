# ============================================================
#   SnowFoxOS v3 — MASTER COLOR SYSTEM
#   Single source of truth for every color of the desktop.
#   Copyright (c) 2026 Alexander Valentin Ludwig (Xr7-Code)
# ============================================================
#
#   Everything that shows color on SnowFoxOS is rendered from
#   this one file:
#
#     polybar · rofi · kitty · GTK2 · GTK3 · GTK4 · i3 · dunst
#     picom · xsettingsd · lock screen · mesh web UI
#
#   ── Commands ───────────────────────────────────────────────
#     snowfox theme                list themes + current one
#     snowfox theme <name>         apply a theme
#     snowfox theme show [name]    full palette of a theme
#     snowfox theme gui            pick a theme in Rofi
#     snowfox theme check          validate this file
#     snowfox theme color <token>  print one color (for scripts)
#
#   ── Format ────────────────────────────────────────────────
#     [meta]            global settings (default theme, order)
#     [theme:NAME]      display label + description
#     [colors:NAME]     color tokens — hex or rgba(...)
#     [ui:NAME]         non-color theme properties
#
#   ── Rules ─────────────────────────────────────────────────
#     * Every theme defines the same token set.
#     * Values are written EXACTLY as they appear in the configs
#       (polybar uses 8-digit hex = #AARRGGBB, alpha first).
#     * Values must be globally unique across all themes: the
#       engine maps colors by value — duplicates are ambiguous.
#       `snowfox theme check` verifies this.
#
#   ── Adding a new theme ────────────────────────────────────
#     1. Copy the [theme/colors/ui] block of an existing theme
#     2. Use unique values for every token
#     3. Add the name to `order`, then run `snowfox theme check`
# ============================================================

[meta]
version = 1
default = snowfox
order   = snowfox blackwhite whiteblack

# ============================================================
#   snowfox — Standard (deep purple night)
# ============================================================
[theme:snowfox]
label = SnowFox — Standard
desc  = Deep purple night · the original SnowFox look

[colors:snowfox]
# ── Base surfaces ───────────────────────────────────────────
bg            = #1a1825
bg_alt        = #201e2e
bg_module     = #2a2840
bg_hover      = #332f50
fg            = #e0d9f5
fg_dim        = #6e6a8a
fg_muted      = #4a4760
on_accent     = #ffffff
shadow        = #0d0b14

# ── Accents ─────────────────────────────────────────────────
accent        = #9d6fe8
accent_lt     = #b899ff
accent_dim    = #5c3d99
accent_deep   = #8139e8

# ── Status ──────────────────────────────────────────────────
red           = #e87a7a
green         = #89c98a
yellow        = #e8c97a
orange        = #e8946a
cyan          = #7acfe8
cyan_lt       = #89dceb
pink          = #ff79c6

# ── Terminal ────────────────────────────────────────────────
term_bg       = #11111b
term0         = #1e1e2e
term_white    = #f7f7fb

# ── Translucent surfaces ────────────────────────────────────
bar_bg        = #CC201e2e
bar_module_bg = #BB2a2840
window_bg     = rgba(26, 24, 37, 0.85)
panel_bg      = rgba(32, 30, 46, 0.80)
hover_bg      = rgba(129, 57, 232, 0.18)
sel_bg        = rgba(129, 57, 232, 0.25)
panel_border  = rgba(129, 57, 232, 0.30)
border_glow   = rgba(184, 153, 255, 0.50)

[ui:snowfox]
gtk_theme     = Arc-Dark
icon_theme    = Papirus-Dark
prefer_dark   = 1
color_scheme  = prefer-dark
folder_color  = violet

# ============================================================
#   blackwhite — Black & White (dark monochrome)
# ============================================================
[theme:blackwhite]
label = Black & White
desc  = Monochrome · pure greyscale, no color accents

[colors:blackwhite]
# ── Base surfaces ───────────────────────────────────────────
bg            = #0a0a0a
bg_alt        = #151515
bg_module     = #1e1e1e
bg_hover      = #2d2d2d
fg            = #e6e6e6
fg_dim        = #9c9c9c
fg_muted      = #606060
on_accent     = #ffffff
shadow        = #000000

# ── Accents (grey steps replace the purple) ─────────────────
accent        = #808080
accent_lt     = #cccccc
accent_dim    = #3c3c3c
accent_deep   = #4f4f4f

# ── Status (lightness steps) ────────────────────────────────
red           = #d4d4d4
green         = #bdbdbd
yellow        = #e0e0e0
orange        = #ababab
cyan          = #c9c9c9
cyan_lt       = #dcdcdc
pink          = #a6a6a6

# ── Terminal ────────────────────────────────────────────────
term_bg       = #050505
term0         = #191919
term_white    = #f7f7fb

# ── Translucent surfaces ────────────────────────────────────
bar_bg        = #CC151515
bar_module_bg = #BB1e1e1e
window_bg     = rgba(10, 10, 10, 0.88)
panel_bg      = rgba(21, 21, 21, 0.84)
hover_bg      = rgba(230, 230, 230, 0.10)
sel_bg        = rgba(230, 230, 230, 0.18)
panel_border  = rgba(230, 230, 230, 0.28)
border_glow   = rgba(230, 230, 230, 0.45)

[ui:blackwhite]
gtk_theme     = Arc-Dark
icon_theme    = Papirus-Dark
prefer_dark   = 1
color_scheme  = prefer-dark
folder_color  = grey

# ============================================================
#   whiteblack — White & Black (light)
# ============================================================
[theme:whiteblack]
label = White & Black
desc  = Daylight · light surfaces, black text and accents

[colors:whiteblack]
# ── Base surfaces ───────────────────────────────────────────
bg            = #fbfbfb
bg_alt        = #f1f1f1
bg_module     = #e5e5e5
bg_hover      = #d9d9d9
fg            = #131313
fg_dim        = #6c6c6c
fg_muted      = #8a8a8a
on_accent     = #ffffff
shadow        = #b5b5b5

# ── Accents (near-black, text on them stays white) ──────────
accent        = #1c1c1c
accent_lt     = #3a3a3a
accent_dim    = #2b2b2b
accent_deep   = #454545

# ── Status (dark greys) ─────────────────────────────────────
red           = #2e2e2e
green         = #343434
yellow        = #3f3f3f
orange        = #292929
cyan          = #444444
cyan_lt       = #4a4a4a
pink          = #505050

# ── Terminal ────────────────────────────────────────────────
term_bg       = #fcfcfc
term0         = #3b3b3b
term_white    = #f7f7fb

# ── Translucent surfaces ────────────────────────────────────
bar_bg        = #CCF1F1F1
bar_module_bg = #BBE5E5E5
window_bg     = rgba(251, 251, 251, 0.90)
panel_bg      = rgba(241, 241, 241, 0.88)
hover_bg      = rgba(20, 20, 20, 0.08)
sel_bg        = rgba(20, 20, 20, 0.86)
panel_border  = rgba(20, 20, 20, 0.30)
border_glow   = rgba(28, 28, 28, 0.55)

[ui:whiteblack]
gtk_theme     = Arc
icon_theme    = Papirus
prefer_dark   = 0
color_scheme  = prefer-light
folder_color  = grey
