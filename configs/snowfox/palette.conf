# ============================================================
#   SnowFoxOS v3.4 — MASTER COLOR SYSTEM
#   Single source of truth for every color of the desktop.
#   Copyright (c) 2026 Alexander Valentin Ludwig (Xr7-Code)
#
#   Design: Neutral grey/black base · Purple accent only
#   Everything that shows color on SnowFoxOS is rendered from
#   this one file:
#     polybar · rofi · kitty · GTK2 · GTK3 · GTK4 · i3 · dunst
#
#   Commands:
#     snowfox theme               list themes + current one
#     snowfox theme <name>        apply a theme
#     snowfox theme show [name]   full palette of a theme
#     snowfox theme check         validate this file
# ============================================================

[meta]
version = 2
default = snowfox
order   = snowfox mono

# ============================================================
#   snowfox — Standard dark (grey/black base · purple accent)
# ============================================================
[theme:snowfox]
label = SnowFox Dark
desc  = Neutral grey/black · purple accent · clean minimalism

[colors:snowfox]
# ── Base surfaces (neutral greys — no purple tint) ──────────
bg            = #111111
bg_alt        = #1a1a1a
bg_hover      = #252525
border        = #2a2a2a
border_focus  = #3a3a3a

# ── Text (neutral whites/greys) ─────────────────────────────
fg            = #e8e8e8
fg_dim        = #888888
fg_muted      = #4a4a4a
on_accent     = #ffffff

# ── Accent (purple — used only for highlights) ───────────────
accent        = #9966cc
accent_lt     = #b399e0
accent_dim    = #5c3d80

# ── Status ──────────────────────────────────────────────────
red           = #cc6666
green         = #88aa77
yellow        = #ddbb66
cyan          = #77aacc
orange        = #cc8855

# ── Translucent surfaces (Polybar) ──────────────────────────
bar_bg        = #EE111111
bar_module_bg = #DD1a1a1a
window_bg     = rgba(17, 17, 17, 0.90)
panel_bg      = rgba(26, 26, 26, 0.88)
hover_bg      = rgba(153, 102, 204, 0.12)
sel_bg        = rgba(153, 102, 204, 0.22)
panel_border  = rgba(153, 102, 204, 0.28)
border_glow   = rgba(179, 153, 224, 0.45)

# ── Terminal ────────────────────────────────────────────────
term_bg       = #0d0d0d
term_fg       = #e8e8e8

[ui:snowfox]
gtk_theme     = Arc-Dark
icon_theme    = Papirus-Dark
prefer_dark   = 1
color_scheme  = prefer-dark
folder_color  = violet

# ============================================================
#   mono — Monochrome (pure greyscale, no purple)
# ============================================================
[theme:mono]
label = Monochrome
desc  = Pure greyscale · no color accent

[colors:mono]
# ── Base surfaces ───────────────────────────────────────────
bg            = #0d0d0d
bg_alt        = #161616
bg_hover      = #222222
border        = #282828
border_focus  = #383838

# ── Text ────────────────────────────────────────────────────
fg            = #e0e0e0
fg_dim        = #808080
fg_muted      = #464646
on_accent     = #111111

# ── Accent (light grey replaces purple) ──────────────────────
accent        = #c0c0c0
accent_lt     = #e0e0e0
accent_dim    = #606060

# ── Status ──────────────────────────────────────────────────
red           = #c0c0c0
green         = #b0b0b0
yellow        = #d0d0d0
cyan          = #b8b8b8
orange        = #a8a8a8

# ── Translucent surfaces ────────────────────────────────────
bar_bg        = #EE0d0d0d
bar_module_bg = #DD161616
window_bg     = rgba(13, 13, 13, 0.92)
panel_bg      = rgba(22, 22, 22, 0.90)
hover_bg      = rgba(192, 192, 192, 0.10)
sel_bg        = rgba(192, 192, 192, 0.18)
panel_border  = rgba(192, 192, 192, 0.25)
border_glow   = rgba(224, 224, 224, 0.40)

# ── Terminal ────────────────────────────────────────────────
term_bg       = #080808
term_fg       = #e0e0e0

[ui:mono]
gtk_theme     = Arc-Dark
icon_theme    = Papirus-Dark
prefer_dark   = 1
color_scheme  = prefer-dark
folder_color  = grey
