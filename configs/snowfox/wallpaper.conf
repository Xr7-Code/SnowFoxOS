# SnowFoxOS v4 — wallpaper state
# This file is rewritten by `snowfox wallpaper set` and
# `snowfox wallpaper auto`. It is NOT a theme file — it only
# records which image the user picked and, if auto-palette ran,
# which generated theme was derived from it.
#
# Format:
#   source=<absolute path to the active wallpaper>
#   timestamp=<ISO-8601>
#   auto_theme=<absolute path to wallpaper-auto.theme, optional>
#
# Do not edit by hand while a session is running — the CLI
# overwrites it on the next set/auto.

