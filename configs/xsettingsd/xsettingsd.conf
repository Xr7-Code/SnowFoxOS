# SnowFoxOS v4 — xsettingsd
# Theme-managed keys (Net/ThemeName, Net/IconThemeName, Gtk/CursorTheme*) are
# written by theme_engine (_render_xsettingsd) into the SNOWFOX PALETTE block.
# Keep only the static, non-theme-managed settings here to avoid duplicates.
Gtk/FontName "Inter 11"
Net/EnableEventSounds 0
Net/EnableInputFeedbackSounds 0
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"

# BEGIN SNOWFOX PALETTE
# END SNOWFOX PALETTE
