# themes/theme.conf
# SnowFoxOS v3.4 — Active theme pointer and render rules

ACTIVE_THEME="snowfox-dark"

# Render rules: target|template|description
# cli/theme.sh iterates this array, renders each template, writes to target.
RENDER_RULES=(
    "$HOME/.config/polybar/config.ini|templates/polybar.ini.tmpl|Polybar"
    "$HOME/.config/rofi/config.rasi|templates/rofi.rasi.tmpl|Rofi"
    "$HOME/.config/kitty/kitty.conf|templates/kitty.conf.tmpl|Kitty"
    "$HOME/.config/i3/colors.conf|templates/i3-colors.conf.tmpl|i3 colors"
    "$HOME/.config/dunst/dunstrc|templates/dunstrc.tmpl|Dunst"
    "$HOME/.config/picom.conf|templates/picom.conf.tmpl|Picom"
    "$HOME/.config/gtk-3.0/gtk.css|templates/gtk-3.0.css.tmpl|GTK3"
    "$HOME/.config/gtk-4.0/gtk.css|templates/gtk-4.0.css.tmpl|GTK4"
    "$HOME/.gtkrc-2.0|templates/gtkrc-2.0.tmpl|GTK2"
)
